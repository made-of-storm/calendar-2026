<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Визы — Calendar CMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css?v=5" />
</head>
<body>
  <div id="loginScreen" class="screen">
    <div class="card card--narrow">
      <h1>Визы — Calendar 2026</h1>
      <p class="muted">Редактор визового режима</p>
      <label class="field">
        <span>Пароль</span>
        <div class="pass-wrap">
          <input type="password" id="passwordInput" placeholder="Введи пароль" autocomplete="current-password" />
          <button type="button" class="pass-toggle" id="passToggle" aria-label="Показать пароль" title="Показать пароль">
            <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg>
          </button>
        </div>
      </label>
      <button type="button" class="btn btn--primary" id="loginBtn">Войти</button>
      <p id="loginError" class="error hidden"></p>
      <details class="advanced">
        <summary>Настройки подключения</summary>
        <label class="field">
          <span>URL API (Google Apps Script)</span>
          <input type="url" id="apiUrlInput" placeholder="https://script.google.com/macros/s/.../exec" />
        </label>
        <p class="muted">Заполняется автоматически — трогать не нужно.</p>
      </details>
      <p class="hint"><a href="admin-visual.html">← Вернуться в визуальный редактор</a></p>
    </div>
  </div>

  <div id="appScreen" class="screen hidden">
    <header class="topbar">
      <div class="topbar__tabs">
        <span class="muted">Визовый режим</span>
      </div>
      <div class="topbar__actions">
        <a href="admin-visual.html" class="btn btn--ghost">Редактор календаря</a>
        <button type="button" class="btn btn--ghost" id="logoutBtn">Выйти</button>
      </div>
    </header>

    <div class="visa-view" id="visaView">
      <div class="visa-toolbar">
        <label class="field visa-cit-field">
          <span>Гражданство посетителя</span>
          <select id="visaCitizenship"></select>
        </label>
        <button type="button" class="btn btn--primary" id="saveVisaBtn">Сохранить визы</button>
      </div>
      <p class="muted">Для выбранного гражданства задай визовый режим по каждой стране назначения.</p>
      <div id="visaRows"></div>
      <button type="button" class="btn btn--ghost" id="addVisaCountryBtn">+ Добавить страну</button>
    </div>
  </div>

  <script src="data/cms-config.js"></script>
  <script src="admin-legacy.js?v=3"></script>
</body>
</html>
